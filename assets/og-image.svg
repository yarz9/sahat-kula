<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A130C"/>
      <stop offset="1" stop-color="#0E0A06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#D67A2E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D67A2E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- decorative tower -->
  <g transform="translate(950, 100)" stroke="#C9A875" stroke-width="2" fill="none" opacity="0.35">
    <rect x="40" y="200" width="100" height="280"/>
    <circle cx="90" cy="100" r="68"/>
    <line x1="90" y1="100" x2="90" y2="55" stroke-linecap="round"/>
    <line x1="90" y1="100" x2="125" y2="100" stroke-linecap="round"/>
    <line x1="40" y1="260" x2="140" y2="260"/>
    <line x1="40" y1="320" x2="140" y2="320"/>
    <line x1="40" y1="380" x2="140" y2="380"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(80, 90)" stroke="#B0894A" stroke-width="2.4" fill="none" stroke-linecap="round">
    <rect x="13.5" y="22" width="13" height="14" transform="scale(2.2)"/>
    <path d="M11.5 22h17" transform="scale(2.2)"/>
    <circle cx="20" cy="13" r="7" transform="scale(2.2)"/>
    <line x1="20" y1="13" x2="20" y2="8" transform="scale(2.2)"/>
    <line x1="20" y1="13" x2="23.5" y2="13" transform="scale(2.2)"/>
  </g>

  <!-- eyebrow -->
  <text x="80" y="290" fill="#C9A875" font-family="'DM Mono', monospace" font-size="18" letter-spacing="4">SARAJEVO · DOBRINJA · OD JUTRA DO KASNO</text>

  <!-- headline -->
  <text x="80" y="380" fill="#F2E9D8" font-family="'Fraunces', Georgia, serif" font-size="92" font-weight="400">Dobar tanjir,</text>
  <text x="80" y="475" fill="#F2E9D8" font-family="'Fraunces', Georgia, serif" font-size="92" font-weight="400">
    <tspan fill="#C9A875" font-style="italic">u pravo</tspan> vrijeme.
  </text>

  <!-- subline -->
  <text x="80" y="540" fill="rgba(242,233,216,0.7)" font-family="'Inter', sans-serif" font-size="22">Sahat Kula Dobrinja — caffe, pizzeria i restoran.</text>

  <!-- bottom rule -->
  <line x1="80" y1="580" x2="1120" y2="580" stroke="rgba(242,233,216,0.18)"/>
  <text x="80" y="612" fill="rgba(242,233,216,0.55)" font-family="'DM Mono', monospace" font-size="14" letter-spacing="3">BULEVAR BRANILACA DOBRINJE BB</text>
  <text x="1120" y="612" text-anchor="end" fill="rgba(242,233,216,0.55)" font-family="'DM Mono', monospace" font-size="14" letter-spacing="3">SAHATKULA.BA</text>
</svg>
